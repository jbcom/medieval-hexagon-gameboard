minimum_pre_commit_version: 4.6.1

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(?:\.full-review/|docs/content/site/about/history/|packages/declarative-hex-worlds/docs/(?:api|plans)/|packages/examples/assets/)
      - id: trailing-whitespace
        exclude: ^(?:\.full-review/|docs/content/site/about/history/|packages/declarative-hex-worlds/docs/(?:api|plans)/|packages/examples/assets/)
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: biome-lint
        name: Biome lint
        entry: pnpm lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
