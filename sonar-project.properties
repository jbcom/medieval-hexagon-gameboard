sonar.projectKey=jbcom_declarative-hex-worlds
sonar.organization=jbcom
sonar.projectName=declarative-hex-worlds
sonar.sourceEncoding=UTF-8

# Analyze shipped TypeScript and the runnable consumer examples. TypeScript
# tests are classified separately, preserving useful issue and coverage views.
sonar.sources=packages/declarative-hex-worlds/src,packages/examples/src
sonar.tests=packages/declarative-hex-worlds/src,packages/declarative-hex-worlds/tests,packages/declarative-hex-worlds/scripts,packages/examples/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**
